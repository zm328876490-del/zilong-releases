<!doctype html>
<html lang="zh-CN">
<head>

  <title>支持与联系 - AI 实时翻译</title>
  <style>
    :root {
      color-scheme: light;
      --text: #172033;
      --muted: #5f6b7a;
      --heading: #0f172a;
      --line: #dde4ee;
      --blue: #2563eb;
      --bg: #f6f8fb;
      --card: #ffffff;
      --soft: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.75;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 22px 72px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 34px 38px;
      box-shadow: 0 18px 48px rgba(20, 32, 55, .06);
    }
    h1, h2 { color: var(--heading); line-height: 1.3; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    h2 { margin: 30px 0 10px; font-size: 20px; }
    p, li { font-size: 15px; }
    p { margin: 0 0 12px; }
    ul { margin: 0; padding-left: 22px; }
    a { color: var(--blue); }
    .box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
      margin-top: 18px;
    }
    .back { display: inline-flex; margin-top: 28px; font-size: 14px; text-decoration: none; }
