<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 实时翻译</title>
  <style>
    :root {
      color-scheme: light;
      --text: #172033;
      --muted: #5f6b7a;
      --line: #dde4ee;
      --blue: #2563eb;
      --bg: #f6f8fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 22px 72px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 34px;
      box-shadow: 0 18px 48px rgba(20, 32, 55, .06);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 16px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      color: var(--blue);
      text-decoration: none;
    }
    nav a {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
      background: #fff;
      color: var(--text);
      font-weight: 600;
    }
    nav a:hover { border-color: #9bb8f5; color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>AI 实时翻译</h1>
      <p>AI 实时翻译是一款浏览器翻译扩展，提供网页翻译、划词翻译、输入框翻译、图片文字识别翻译、视频字幕翻译和语音播报等能力。</p>
      <p>本页面用于提供 Chrome Web Store 审核所需的公开隐私政策和支持入口。</p>
      <nav aria-label="页面导航">
        <a href="privacy.html">隐私政策</a>
        <a href="support.html">支持与联系</a>
        <a href="terms.html">用户协议</a>
      </nav>
    </section>
  </main>
</body>
</html>
