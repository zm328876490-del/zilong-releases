<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360, initial-scale=1.0">
  <title>AI 实时翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header" id="header">
      <img class="header-avatar plan-trial" id="headerAvatar" src="icons/icon.png" alt="AI翻译" title="点击管理账号">
      <div class="header-text">
        <h3>AI 实时翻译</h3>
        <div class="header-sub" id="headerSub">
          <span class="lic-dot anonymous"></span>
          <span id="headerLicText">体验版 · 未登录</span>
          <span class="sep">|</span>
          <a id="headerLogin">登录</a>
          <a id="headerUpgrade">升级</a>
        </div>
      </div>
      <div class="header-badge-wrap">
        <select class="header-badge" id="engineBadge">
          <option value="microsoft">🌐 微软 </option>
          <option value="google">🌐 Google </option>
          <option value="ollama">🖥️ 本地 </option>
        </select>
      </div>
    </div>
    <select id="translateEngine" style="display:none">
      <option value="microsoft">🌐 微软翻译</option>
      <option value="google">🌐 Google 翻译</option>
      <option value="ollama">🖥️ 本地 Ollama</option>
    </select>

    <main>
      <div class="form-row lang-row">
        <div class="form-group">
          <label for="sourceLang">🌐 源语言</label>
          <select id="sourceLang">
            <option value="auto">🌐 自动检测</option>
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="th">🇹🇭 ไทย</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetLang">🌐 目标语言</label>
          <select id="targetLang">
            <option value="zh-Hans">🇨🇳 中文(简体)</option>
            <option value="en">🇺🇸 English</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="th">🇹🇭 ไทย</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
          </select>
        </div>
      </div>

      <div class="section-card glass-card" id="localServiceCard">
        <div class="section-label">本地服务</div>
        <div class="service-row">
          <span id="serviceStatus" class="service-status checking">检测中...</span>
          <button id="installBtn" class="btn-install" style="display:none">一键安装后台服务</button>
        </div>
      </div>

      <div class="section-card glass-card">
        <div class="section-label">📄 页面翻译设置</div>
        <div class="toggle-row">
          <span>🌍 打开浏览器自动翻译</span>
          <label class="switch">
            <input type="checkbox" id="toggleGlobal">
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span>📖 双语对照（保留原文）</span>
          <label class="switch">
            <input type="checkbox" id="toggleBilingualPage">
            <span class="slider"></span>
          </label>
        </div>
        <div class="hint-text">💡 右键点击页面图片，即可翻译图中文字</div>
      </div>

      <div class="section-card glass-card">
        <div class="section-label">🎙️ 视频翻译设置</div>

        <div class="form-group">
          <div class="toggle-row">
            <label for="subtitleToggle">💬 字幕开关</label>
            <label class="switch">
              <input type="checkbox" id="subtitleToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="form-group" id="subtitleSizeSection">
          <div class="slider-row">
            <label for="subtitleSize">🔤 字幕大小 <span id="subtitleSizeVal">50%</span></label>
            <input type="range" id="subtitleSize" min="30" max="200" value="50" step="5">
          </div>
          <div id="subtitleSizeNote" style="display:none;color:#888;font-size:11px;margin-top:4px">浮窗模式下字幕由浮窗控制，此设置不生效</div>
        </div>

        <div class="form-group">
          <div class="slider-row">
            <label for="originalVolume">🔈 原声音量 <span id="originalVolumeVal">30%</span></label>
            <input type="range" id="originalVolume" min="1" max="100" value="30" step="5">
          </div>
          <div id="originalVolumeNote" style="display:none;color:#888;font-size:11px;margin-top:4px">浮窗模式下原声已压低（保留 10% 给 ASR），此设置不生效</div>
        </div>

        <div class="form-group">
          <div class="slider-row">
            <label for="ttsVolume">🎙️ 配音音量 <span id="ttsVolumeVal">100%</span></label>
            <input type="range" id="ttsVolume" min="0" max="100" value="100" step="5">
          </div>
        </div>
      </div>

      <div id="errorMsg" class="error-msg" style="display:none"></div>
    </main>

  <div id="ollamaModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3>🖥️ Ollama 设置</h3>
      <div class="form-group">
        <label for="ollamaUrl">🔗 Ollama 地址</label>
        <input type="text" id="ollamaUrl" placeholder="http://localhost:11434" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="ollamaModel">🧠 翻译模型</label>
        <input type="text" id="ollamaModel" placeholder="qwen2.5:7b" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button id="ollamaCancel" class="btn-cancel">✕ 取消</button>
        <button id="ollamaConfirm" class="btn-confirm">✓ 确定</button>
      </div>
    </div>
  </div>

  <!-- ════ 登录弹窗 ════ -->
  <div class="lic-modal-bg" id="licModalBg">
    <div class="lic-modal">
      <h4>登录 AI 实时翻译</h4>
      <button class="modal-close" id="btnLicX">&#x2715;</button>
      <p>新用户首次登录即注册；同一账号同时只能在 1 台设备使用。</p>
      <div class="auth-row" style="margin-bottom:8px">
        <input type="email" id="authEmailInput" placeholder="邮箱（Gmail / QQ / 163 等）" autocomplete="username" spellcheck="false">
        <button class="btn-mini" id="btnSendCode">发送验证码</button>
      </div>
      <input type="text" id="authCodeInput" placeholder="6 位验证码" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
      <div class="auth-tip">验证码 5 分钟有效；同邮箱 60 秒内只能发 1 条。</div>
      <div class="lic-msg" id="licMsg"></div>
      <div class="lic-modal-actions">
        <button class="btn-cancel" id="btnLicCancel">取消</button>
        <button class="btn-ok" id="btnLicOk">登录</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
