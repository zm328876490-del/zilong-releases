<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>AI 实时翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI 实时翻译</h1>
      <div id="statusIndicator" class="status-idle">
        <span class="dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <main>
      <div class="form-row">
        <div class="form-group">
          <label for="sourceLang">源语言</label>
          <select id="sourceLang">
            <option value="auto">自动检测</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetLang">目标语言</label>
          <select id="targetLang">
            <option value="zh-Hans">中文(简体)</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="translateEngine">翻译引擎</label>
        <select id="translateEngine">
          <option value="microsoft">微软翻译</option>
          <option value="google">Google 翻译</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ttsVoice">TTS 音色</label>
        <select id="ttsVoice"></select>
      </div>

      <div class="form-group">
        <div class="toggle-row">
          <label for="subtitleToggle">字幕开关</label>
          <label class="switch">
            <input type="checkbox" id="subtitleToggle" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <div class="slider-row">
          <label for="subtitleSize">字幕大小 <span id="subtitleSizeVal">50%</span></label>
          <input type="range" id="subtitleSize" min="30" max="200" value="50" step="5">
        </div>
      </div>

      <div class="form-group">
        <div class="slider-row">
          <label for="originalVolume">原声音量 <span id="originalVolumeVal">30%</span></label>
          <input type="range" id="originalVolume" min="1" max="100" value="30" step="5">
        </div>
      </div>

      <div class="form-group">
        <div class="slider-row">
          <label for="ttsVolume">TTS音量 <span id="ttsVolumeVal">100%</span></label>
          <input type="range" id="ttsVolume" min="0" max="100" value="100" step="5">
        </div>
      </div>

      <button id="toggleBtn" class="btn-start">
        <span id="toggleIcon">▶</span>
        <span id="toggleText">开始翻译</span>
      </button>

      <div id="errorMsg" class="error-msg" style="display:none"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
