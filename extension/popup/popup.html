<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>AI 实时翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI 实时翻译</h1>
      <div id="statusIndicator" class="status-idle">
        <span class="dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <main>
      <div class="form-row">
        <div class="form-group">
          <label for="sourceLang">源语言</label>
          <select id="sourceLang">
            <option value="auto">自动检测</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetLang">目标语言</label>
          <select id="targetLang">
            <option value="zh-Hans">中文(简体)</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="th">ไทย</option>
            <option value="vi">Tiếng Việt</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="translateEngine">翻译引擎</label>
        <select id="translateEngine">
          <option value="microsoft">微软翻译</option>
          <option value="google">Google 翻译</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ttsVoice">TTS 音色</label>
        <select id="ttsVoice">
          <option value="default">默认女声</option>
          <option value="xiaoxiao">晓晓 (女·温柔)</option>
          <option value="yunxi">云希 (男)</option>
          <option value="xiaoyi">晓伊 (女·活泼)</option>
          <option value="yunyang">云扬 (男·新闻)</option>
          <option value="xiaochen">晓辰 (女·亲切)</option>
        </select>
      </div>

      <button id="toggleBtn" class="btn-start">
        <span id="toggleIcon">▶</span>
        <span id="toggleText">开始翻译</span>
      </button>

      <div id="errorMsg" class="error-msg" style="display:none"></div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
