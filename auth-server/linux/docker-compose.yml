services:
  mysql:
    image: mysql:8.0
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auth_server
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-server:
    build:
      context: ..
      dockerfile: linux/Dockerfile
    container_name: auth-server
    restart: unless-stopped
    ports:
      - "14532:14532"
    env_file:
      - ../.env
    environment:
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/auth_server?charset=utf8mb4&parseTime=true&loc=UTC
      DIST_ZIP_PATH: /data/dist.zip
    volumes:
      - ../dist.zip:/data/dist.zip:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
