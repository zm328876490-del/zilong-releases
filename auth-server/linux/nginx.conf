# AI Translation - 追加到已有的 server 块内

# Product landing page
location / {
    root /home/project/auth-server/web;
    index index.html;
}

# Extension zip download
location /extension.zip {
    alias /home/project/auth-server/extension.zip;
    types { application/zip zip; }
    add_header Cache-Control "no-cache";
}

# Auth server API
location /auth-server/api/ {
    proxy_pass http://auth-server:14532/api/;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /auth-server/health {
    proxy_pass http://auth-server:14532/health;
    proxy_set_header Host $host;
}
